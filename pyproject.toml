[project]
name = "mytool"
version = "0.1.0"
description = "Static analysis + LLM patch suggestions with verification."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "rich>=15.0.0",
    "typer>=0.29.3",
]

[project.scripts]
mytool = "mytool.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mytool"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
